# Retained historical workflow name for backwards compatibility only.
# It previously auto-committed on issue comments but did not invoke Gemini/OpenAI.
# The authorized AI-LAB coordination entry point is Issue #62 / PR #63.
name: "Legacy Gemini/OpenAI agent - disabled (see AI Lab #62)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecation:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why this legacy workflow no longer performs actions
        shell: bash
        run: |
          echo 'This workflow is intentionally inert.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does not call AI models, alter code, commit or deploy.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the reviewed AI Lab gateways tracked in Issue #62.' >> "$GITHUB_STEP_SUMMARY"

name: "TARGILIM AI LAB - read-only control"
on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-lab-status
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'yanivmizrachiy/targilim' &&
      github.actor == 'yanivmizrachiy' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 62 &&
          github.event.comment.body == '/ai-lab status'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout (no push credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify baseline and flag legacy automation
        shell: bash
        run: |
          set -euo pipefail
          echo '# TARGILIM AI LAB — read-only preflight' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'No models invoked. No commits, API inference, merge, or deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          test -s RULES.md
          test -s PROJECT_STATUS.md
          test -s docs/SOURCE_BIBLE.md
          test -s .github/workflows/gemini-agent.yml
          node -e "const p=require('./package.json'); if(!p.scripts['verify:deep']) process.exit(1)"
          echo '- PASS: rules, status, source bible and verify:deep definition exist' >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'git-auto-commit-action' .github/workflows/gemini-agent.yml; then
            echo '- BLOCKER: legacy Gemini-named workflow includes auto-commit; review before enabling agents' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- STATE: PREFLIGHT_ONLY — Gemini/Claude/Codex NOT CONNECTED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Follow-up: https://github.com/yanivmizrachiy/targilim/issues/62' >> "$GITHUB_STEP_SUMMARY"

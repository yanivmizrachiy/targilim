name: "TARGILIM AI LAB - read-only control"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/ai-lab-control.yml'
      - 'tools/ai-lab-preflight.mjs'
      - 'tools/ai-lab-preflight.test.mjs'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-lab-status
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'yanivmizrachiy/targilim' &&
      github.actor == 'yanivmizrachiy' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 63 &&
          github.event.pull_request.head.repo.full_name == 'yanivmizrachiy/targilim'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 62 &&
          github.event.comment.body == '/ai-lab status'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main code, without push credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regression tests for the fail-closed readiness checker
        run: node --test tools/ai-lab-preflight.test.mjs

      - name: Readiness audit and machine-readable result
        shell: bash
        run: |
          set -euo pipefail
          node tools/ai-lab-preflight.mjs > "$RUNNER_TEMP/ai-lab-status.json"
          node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'ai-lab-status.json'), 'utf8'));
          const line = (text) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          line('# TARGILIM AI LAB — independent read-only audit');
          line('');
          line('**No model providers were called. No secrets, commits, PR merges or deployments.**');
          line('');
          line('- Repository baseline: **' + report.baseline + '**');
          line('- Commit SHA: ' + report.checked_sha);
          line('- Next gate: ' + report.next_gate);
          line('');
          line('## Checks');
          for (const [key, value] of Object.entries(report.checks)) {
            line('- ' + (value ? 'PASS' : 'FAIL') + ': ' + key);
          }
          line('');
          line('## Risks and blockers');
          for (const item of report.findings) line('- ' + item);
          line('- Gemini / Claude Code / Codex: authentication and live calls **NOT VERIFIED**');
          line('- Planning and approval: https://github.com/yanivmizrachiy/targilim/issues/62');
          NODE
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
